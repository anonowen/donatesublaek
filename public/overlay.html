<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Donation Overlay</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    font-family: 'Sarabun', 'Noto Sans Thai', sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }

  #alert-container {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 560px;
    pointer-events: none;
  }

  .alert-box {
    display: flex;
    align-items: center;
    gap: 16px;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    border: 2px solid transparent;
    border-radius: 16px;
    padding: 18px 24px;
    box-shadow:
      0 0 0 1px rgba(255,215,0,0.3),
      0 0 30px rgba(255,215,0,0.2),
      0 8px 32px rgba(0,0,0,0.6);
    opacity: 0;
    transform: translateY(60px) scale(0.9);
    transition: none;
    position: relative;
    overflow: hidden;
  }

  .alert-box::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,215,0,0.08), transparent);
    animation: none;
  }

  .alert-box.show {
    animation: alertIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  .alert-box.show::before {
    animation: shimmer 1.8s ease-in-out 0.5s infinite;
  }

  .alert-box.hide {
    animation: alertOut 0.4s ease-in forwards;
  }

  @keyframes alertIn {
    from { opacity: 0; transform: translateY(60px) scale(0.9); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes alertOut {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to   { opacity: 0; transform: translateY(-20px) scale(0.95); }
  }

  @keyframes shimmer {
    0%   { left: -100%; }
    100% { left: 200%; }
  }

  @keyframes coinBounce {
    0%, 100% { transform: scale(1) rotate(0deg); }
    25% { transform: scale(1.2) rotate(-10deg); }
    75% { transform: scale(1.1) rotate(10deg); }
  }

  .icon {
    font-size: 42px;
    flex-shrink: 0;
    animation: none;
    filter: drop-shadow(0 0 8px rgba(255,215,0,0.6));
  }

  .alert-box.show .icon {
    animation: coinBounce 0.8s ease-in-out 0.3s 2;
  }

  .content {
    flex: 1;
    min-width: 0;
  }

  .header-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }

  .sender {
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 220px;
  }

  .label {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    font-weight: 400;
  }

  .amount {
    font-size: 28px;
    font-weight: 900;
    color: #FFD700;
    text-shadow: 0 0 12px rgba(255,215,0,0.5);
    letter-spacing: -0.5px;
    margin-left: auto;
    flex-shrink: 0;
  }

  .message {
    margin-top: 6px;
    font-size: 15px;
    color: rgba(255,255,255,0.8);
    line-height: 1.4;
    word-break: break-word;
  }

  .message:empty { display: none; }

  #unlock-btn {
    position: fixed;
    top: 12px; right: 12px;
    background: rgba(255,215,0,0.15);
    border: 1px solid rgba(255,215,0,0.4);
    color: #FFD700;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-family: inherit;
    backdrop-filter: blur(4px);
    transition: opacity 0.3s;
    z-index: 999;
  }
  #unlock-btn.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div id="alert-container"></div>
<button id="unlock-btn" onclick="unlockAudio()">🔊 เปิดเสียง</button>
<script>
  const container = document.getElementById('alert-container');
  const queue = [];
  let busy = false;
  let audioUnlocked = false;

  function unlockAudio() {
    // Play silent buffer to unlock autoplay policy
    alertAudio.volume = 0;
    alertAudio.play().then(() => {
      alertAudio.pause();
      alertAudio.currentTime = 0;
      alertAudio.volume = cfg.chimeVolume ?? 0.6;
      audioUnlocked = true;
      // Unlock speech synthesis
      const utt = new SpeechSynthesisUtterance('');
      window.speechSynthesis.speak(utt);
      document.getElementById('unlock-btn').classList.add('hidden');
    }).catch(() => {});
  }
  let audioCtx = null;
  let cfg = {
    chimeEnabled: true, chimeVolume: 0.6,
    ttsEnabled: true, ttsVoice: '', ttsRate: 0.95, ttsPitch: 1.1,
    alertDuration: 6000
  };

  // Load settings from server
  fetch('/api/settings').then(r => r.json()).then(s => { cfg = s; }).catch(() => {});

  // ---- Alert sound ----
  const alertAudio = new Audio('/sounds/alert.mp3');
  function playChime(sender, amount, message) {
    if (!cfg.chimeEnabled) {
      speak(sender, amount, message);
      return;
    }
    try {
      alertAudio.volume = cfg.chimeVolume ?? 0.6;
      alertAudio.currentTime = 0;
      alertAudio.onended = () => speak(sender, amount, message);
      alertAudio.play().catch(e => {
        console.warn('Audio error', e);
        speak(sender, amount, message);
      });
    } catch (e) {
      console.warn('Audio error', e);
      speak(sender, amount, message);
    }
  }

  // ---- Text-to-Speech (server TTS proxy) ----
  function speak(sender, amount, message) {
    if (!cfg.ttsEnabled) return;
    const amountText = Number(amount).toLocaleString('th-TH') + ' บาท';
    let text = `${sender} โอน ${amountText}`;
    if (message) text += ` พูดว่า ${message}`;
    const src = `/api/tts?text=${encodeURIComponent(text)}`;
    const audio = new Audio(src);
    audio.play().catch(e => console.warn('TTS error', e));
  }

  function formatAmount(n) {
    return '฿' + Number(n).toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  }

  function showAlert({ sender, amount, message }) {
    return new Promise((resolve) => {
      const box = document.createElement('div');
      box.className = 'alert-box';
      box.innerHTML = `
        <div class="icon">💰</div>
        <div class="content">
          <div class="header-row">
            <span class="sender">${escapeHtml(sender)}</span>
            <span class="label">โอนมา</span>
          </div>
          <div class="message">${escapeHtml(message)}</div>
        </div>
        <div class="amount">${formatAmount(amount)}</div>
      `;

      container.appendChild(box);

      // Trigger reflow then animate in
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          box.classList.add('show');
          playChime(sender, amount, message);
        });
      });

      // Hold then animate out
      setTimeout(() => {
        box.classList.remove('show');
        box.classList.add('hide');
        box.addEventListener('animationend', () => {
          box.remove();
          resolve();
        }, { once: true });
      }, cfg.alertDuration ?? 6000);
    });
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  async function processQueue() {
    if (busy || queue.length === 0) return;
    busy = true;
    while (queue.length > 0) {
      const item = queue.shift();
      await showAlert(item);
      await new Promise(r => setTimeout(r, 600)); // gap between alerts
    }
    busy = false;
  }

  function connect() {
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${location.host}`);

    ws.onopen = () => console.log('[WS] Connected');

    ws.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);
        if (data.type === 'donation') {
          queue.push(data);
          processQueue();
        } else if (data.type === 'settings') {
          cfg = data.settings;
        }
      } catch {}
    };

    ws.onclose = () => {
      console.log('[WS] Disconnected — reconnecting in 3s');
      setTimeout(connect, 3000);
    };
  }

  connect();
</script>
</body>
</html>
